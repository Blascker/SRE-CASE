apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault-namespace
data:
  vault.hcl: |
    ui = true
    disable_mlock = true
    
    listener "tcp" {
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_min_version = "tls12"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file = "/vault/tls/tls.key"
    }
    
    storage "raft" {
      path = "/vault/data"
    
      retry_join {
        leader_api_addr = "https://vault-0.vault-internal.vault-namespace.svc.cluster.local:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://vault-1.vault-internal.vault-namespace.svc.cluster.local:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
      }
      retry_join {
        leader_api_addr = "https://vault-2.vault-internal.vault-namespace.svc.cluster.local:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
      }
    }
