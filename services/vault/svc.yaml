apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-namespace
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: https
      port: 8200
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault-namespace
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: https
      port: 8200
      targetPort: https
    - name: cluster
      port: 8201
      targetPort: cluster
