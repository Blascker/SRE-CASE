---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  datasource.yaml: |
    ---
    apiVersion: 1
    datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-providers
  namespace: monitoring
data:
  dashboards.yaml: |
    ---
    apiVersion: 1
    providers:
    - name: kubernetes
      type: file
      disableDeletion: true
      allowUiUpdates: false
      options:
        path: "/etc/grafana/dashboards"
