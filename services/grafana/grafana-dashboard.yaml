---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  kubernetes.json: |-
    {
      "uid": "kubernetes-overview",
      "title": "Kubernetes overview",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(kube_namespace_status_phase, namespace)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Ready nodes",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 2,
          "title": "Unreachable scrape targets",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up == bool 0)",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 3,
          "title": "Ready pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{namespace=~\"$namespace\",condition=\"true\"})",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 4,
          "title": "Unbound PVCs",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\",phase=~\"Pending|Lost\"})",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 5,
          "title": "Pod phases",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_pod_status_phase{namespace=~\"$namespace\"} == 1",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 6,
          "title": "PVC status",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\"} == 1",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 7,
          "title": "CPU usage by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",image!=\"\"}[5m]))",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 8,
          "title": "Memory usage by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",image!=\"\"})",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 9,
          "title": "PVC used space",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=~\"$namespace\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 10,
          "title": "Container restarts in the last hour",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]) > 0",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 11,
          "title": "HPA desired replicas",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          }
        },
        {
          "id": 12,
          "title": "Longhorn volume health (raw state)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "longhorn_volume_robustness",
              "legendFormat": "{{namespace}} {{pod}} {{persistentvolumeclaim}}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 13,
          "title": "Deployment available replicas",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 14,
          "title": "Persistent volume phases",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 48,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_persistentvolume_status_phase == 1",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 15,
          "title": "Kubernetes Services",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 56,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_service_info{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [

            ]
          },
          "options": {
            "showHeader": true
          }
        }
      ]
    }
