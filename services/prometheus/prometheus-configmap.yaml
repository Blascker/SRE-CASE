---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    ---
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    rule_files:
    - "/etc/prometheus/rules.yml"
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: kube-state-metrics
      static_configs:
      - targets:
        - kube-state-metrics:8080
    - job_name: kubernetes-api
      scheme: https
      authorization: &1
        type: Bearer
        credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config: &2
        ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      static_configs:
      - targets:
        - kubernetes.default.svc:443
    - job_name: kubelet
      scheme: https
      authorization: *1
      tls_config: *2
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_node_name
        target_label: node
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels:
        - __meta_kubernetes_node_name
        target_label: __metrics_path__
        replacement: "/api/v1/nodes/$1/proxy/metrics"
    - job_name: cadvisor
      scheme: https
      authorization: *1
      tls_config: *2
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_node_name
        target_label: node
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels:
        - __meta_kubernetes_node_name
        target_label: __metrics_path__
        replacement: "/api/v1/nodes/$1/proxy/metrics/cadvisor"
    - job_name: node-exporter
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - monitoring
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app
        regex: node-exporter
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: metrics
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node
    - job_name: longhorn
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - longhorn-system
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app
        regex: longhorn-manager
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: manager
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node
  rules.yml: |
    ---
    groups:
    - name: kubernetes-health
      rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes node is not Ready
      - alert: PodNotReady
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})
          > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod is pending, unknown or failed
      - alert: ContainerRestarting
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container is repeatedly restarting
      - alert: PVCNotBound
        expr: kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PVC is not bound
      - alert: PVCAlmostFull
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes
          < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PVC has less than 15 percent available
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Monitoring target is unreachable
      - alert: RunningPodNotReady
        expr: (kube_pod_status_ready{condition="true"} == 0) and on (namespace, pod) (kube_pod_status_phase{phase="Running"}
          == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Running pod is not Ready
