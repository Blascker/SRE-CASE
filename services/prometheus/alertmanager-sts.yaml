---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  serviceName: alertmanager-internal
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.35.0
        args:
        - "--config.file=/etc/alertmanager/alertmanager.yml"
        - "--storage.path=/alertmanager"
        - "--cluster.listen-address="
        ports:
        - name: http
          containerPort: 9093
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: "/alertmanager"
        - name: config
          mountPath: "/etc/alertmanager"
          readOnly: true
        env: []
        readinessProbe:
          httpGet:
            path: "/-/ready"
            port: http
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: "/-/ready"
            port: http
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: "/-/healthy"
            port: http
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 2Gi
