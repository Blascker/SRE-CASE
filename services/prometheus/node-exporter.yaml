---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostPID: true
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.12.1
        args:
        - "--path.procfs=/host/proc"
        - "--path.sysfs=/host/sys"
        - "--path.rootfs=/host/root"
        - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/kubelet/.+|var/lib/(docker|containerd)/.+)($|/)"
        ports:
        - name: metrics
          containerPort: 9100
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: proc
          mountPath: "/host/proc"
          readOnly: true
        - name: sys
          mountPath: "/host/sys"
          readOnly: true
        - name: root
          mountPath: "/host/root"
          readOnly: true
          mountPropagation: HostToContainer
        readinessProbe:
          httpGet:
            path: "/"
            port: metrics
        livenessProbe:
          httpGet:
            path: "/"
            port: metrics
      volumes:
      - name: proc
        hostPath:
          path: "/proc"
          type: Directory
      - name: sys
        hostPath:
          path: "/sys"
          type: Directory
      - name: root
        hostPath:
          path: "/"
          type: Directory
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
