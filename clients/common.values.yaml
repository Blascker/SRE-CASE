# Fleet-wide defaults. Precedence: chart -> common -> client -> local override.
# Each client still owns its PostgreSQL StatefulSet and both data volumes.
vault:
  enabled: true
  server:
    service: vault
    namespace: vault-namespace
    port: 8200
    scheme: https
    caCertSecret: "" # Private CA trust Secret must exist in each client namespace.
  auth:
    mount: kubernetes
    audiences: [vault]
  kvMount: ODOO
# Each client's values.yaml supplies its own Vault role and KV paths.
odoo:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  dbMaxconn: 4
  dbMaxconnGevent: 4
  storage:
    storageClass: longhorn
    accessMode: ReadWriteMany
postgresql:
  storage:
    storageClass: longhorn
traefik:
  enabled: false
sharedIngress:
  enabled: true
  className: traefik
  controller:
    namespace: traefik
    podLabels:
      app.kubernetes.io/name: traefik
resourceQuota:
  enabled: true
  # Room for up to four Odoo replicas and a dedicated PostgreSQL instance.
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "10"
    limits.memory: 20Gi
    pods: "8"
