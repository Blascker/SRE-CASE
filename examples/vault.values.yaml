# Supplied namespace/role/KV location. Confirm service/auth/TLS settings before use.
vault:
  enabled: true
  server:
    service: vault
    namespace: vault-namespace
    port: 8200
    scheme: https
    caCertSecret: "" # Set to a local CA Secret (key ca.crt) if Vault uses a private CA.
  auth:
    mount: kubernetes
    role: vault-role
    audiences: [vault]
  kvMount: ODOO
  credentialsPath: CLIENT-A
  tlsPath: CLIENT-A
