apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-odoo
spec:
  podSelector:
    matchLabels:
      app: odoo
      release: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: traefik
              release: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8069
        - protocol: TCP
          port: 8072
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
              release: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        {{- toYaml .Values.networkPolicy.dnsTo | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
