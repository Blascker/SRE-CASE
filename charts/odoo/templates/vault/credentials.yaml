{{- if .Values.vault.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Release.Name }}-vault-auth
  type: kv-v2
  mount: {{ .Values.vault.kvMount | quote }}
  path: {{ .Values.vault.credentialsPath | quote }}
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: {{ .Values.existingSecret }}
    type: Opaque
    transformation:
      excludeRaw: true
      includes: ["^(admin-password|db-password|postgres-password)$"]
  # PostgreSQL passwords must also be changed in SQL. A pod restart cannot do that.
  # Only Odoo is restarted here to reload its copied config and database credential.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}-odoo
{{- end }}
