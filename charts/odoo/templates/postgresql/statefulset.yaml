apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: postgresql
        release: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # postgres in the Debian-based official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          args:
            - postgres
            - -c
            - shared_buffers={{ .Values.postgresql.sharedBuffers }}
            - -c
            - effective_cache_size={{ .Values.postgresql.effectiveCacheSize }}
            - -c
            - work_mem={{ .Values.postgresql.workMem }}
            - -c
            - maintenance_work_mem={{ .Values.postgresql.maintenanceWorkMem }}
            - -c
            - max_connections={{ .Values.postgresql.maxConnections }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /secrets/postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: ODOO_DB_USER
              value: {{ .Values.odoo.databaseUser | quote }}
            - name: ODOO_DATABASE
              value: {{ .Values.odoo.database | quote }}
            - name: ODOO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: db-password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: credentials
              mountPath: /secrets
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-db-data
        - name: init
          configMap:
            name: {{ .Release.Name }}-db-init
        - name: credentials
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: postgres-password
                path: postgres-password
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
