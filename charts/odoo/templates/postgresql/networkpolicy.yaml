apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-db
spec:
  podSelector:
    matchLabels:
      app: postgresql
      release: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  # Reply traffic is allowed automatically; PostgreSQL starts no external connections.
  egress: []
  ingress:
    - from:
        # Both labels must match, in this namespace.
        - podSelector:
            matchLabels:
              app: odoo
              release: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
