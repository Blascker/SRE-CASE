{{- if .Values.traefik.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: traefik
        release: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/traefik/configmap.yaml") . | sha256sum }}
        tls/revision: {{ .Values.traefik.tlsRevision | quote }}
    spec:
      # File-provider routing requires no Kubernetes API access or cluster RBAC.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: {{ .Values.traefik.image | quote }}
          args: ["--configFile=/etc/traefik/traefik.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
            - name: health
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ping
              port: health
          readinessProbe:
            httpGet:
              path: /ping
              port: health
          resources:
            {{- toYaml .Values.traefik.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-traefik-config
        - name: tls
          secret:
            secretName: {{ .Values.traefik.tlsSecret }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
