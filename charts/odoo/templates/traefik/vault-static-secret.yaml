{{- if and .Values.vault.enabled .Values.traefik.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-traefik-tls
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Release.Name }}-vault-auth
  type: kv-v2
  mount: {{ .Values.vault.kvMount | quote }}
  path: {{ .Values.vault.tlsPath | quote }}
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: {{ .Values.traefik.tlsSecret }}
    type: kubernetes.io/tls
    transformation:
      excludeRaw: true
      includes: ["^tls[.](crt|key)$"]
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}-traefik
{{- end }}
