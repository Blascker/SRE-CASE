{{- if .Values.traefik.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-traefik
  {{- with .Values.traefik.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # The only Service permitted to expose this application outside the cluster.
  type: {{ .Values.traefik.service.type }}
  selector:
    app: traefik
    release: {{ .Release.Name }}
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
{{- end }}
